name: Project Deployment With Github Actions 

# on: [push, workflow_dispatch]

on:
  - push 
  - workflow_dispatch

jobs:

  validate:
    runs-on: ubuntu-latest
    steps:

      - name: Code Clonning
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
      - name: Get Node Version
        run: node -v

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          Version: 10
          run_install: false
      - name: Use Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project 
        run: pnpm run build 

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Clonning The Code 
        uses: actions/checkout@v4
      - name: Setup Node 
        uses: actions/setup-node@v7
      - name: Setup Pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Use Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}


      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Project
        run: pnpm run build
      - name: Deploy Project 
        run: echo "Project Deployed Successfully"
      



